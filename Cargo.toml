# Workspace root. Each crate lives under crates/ and inherits the shared
# metadata, dependency versions and lint rules declared here, so the rules
# are written down once instead of being copied into every crate.

[workspace]
# Resolver 3 is the default for edition 2024; it is spelled out so the
# workspace root (which has no [package] of its own) cannot fall back to an
# older resolver.
resolver = "3"
members = ["crates/admatch-core", "crates/admatch-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kaustubh Agarwal"]
license = "MIT"
repository = "https://github.com/kaustubhagarwal21/admatch-rs"
# Portfolio project: never publish to crates.io by accident.
publish = false

# One place for dependency versions. Crates opt in with `{ workspace = true }`
# and list only the features they actually use, so each crate's Cargo.toml
# still shows what it needs. New entries are added in the milestone that
# first needs them.
[workspace.dependencies]
# Calendar dates for per-day budgets. Default features are off so the core
# crate cannot read the system clock by accident: callers pass the day in.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
# The project rule is "no unsafe code"; forbid makes the compiler enforce it
# (unlike deny, forbid cannot be overridden further down with #[allow]).
unsafe_code = "forbid"
# Every public item carries a doc comment explaining why it exists.
missing_docs = "warn"

[workspace.lints.clippy]
# unwrap()/expect() are banned outside tests. Where an invariant makes a
# failure impossible, allow it locally with #[allow(..., reason = "...")] so
# the justification sits next to the call. Tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
